[package]
name = "sand"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/fosskar/sand"
homepage = "https://github.com/fosskar/sand"
authors = ["rendro", "fosskar"]
description = "Semantic memory for AI agents - local-first, MCP-native"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "memory", "semantic-search", "ai-agent", "embeddings"]
categories = ["command-line-utilities", "database"]
default-run = "sand"

[lib]
name = "sand"
path = "src/lib.rs"

[[bin]]
name = "sand"
path = "src/main.rs"

[[bin]]
name = "sediment"
path = "src/bin/sediment.rs"

[dependencies]
# Database - LanceDB for vector storage
lancedb = "0.27"
# Arrow crates - must match lancedb's version (v57)
arrow-array = "57"
arrow-schema = "57"

# Embeddings - using candle for simpler integration
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "1", features = ["blocking", "rustls-tls"] }
tokenizers = "0.23"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Access tracking
rusqlite = { version = "0.43", features = ["bundled"] }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
sha2 = "0.11"
futures = "0.3"

[features]
bench = []

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
rand = "0.10"

[profile.release]
# unwind, so a panic inside lance during compaction is caught instead of ending the mcp server
panic = "unwind"

[[bench]]
name = "recall_bench"
harness = false
